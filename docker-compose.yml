services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jmo
      POSTGRES_PASSWORD: jmo
      POSTGRES_DB: jmo
    ports:
      - "54329:5432"
    volumes:
      - jmo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jmo -d jmo"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  jmo-db:
